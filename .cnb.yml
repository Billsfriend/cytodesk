# CNB (cnb.cool) pipeline.
#
# Like the GitHub workflow, CNB only runs on version tags (0.* / v*).
# CNB runs Linux containers, so it builds the Linux x64 package here.
# Windows x64 and macOS arm64 packaging remain in .github/workflows/build-desktop.yml,
# because PyInstaller cannot cross-compile those platforms from Linux.

.linux-pipeline: &linux-pipeline
  runner:
    tags: cnb:arch:amd64
    cpus: 2
  docker:
    build:
      dockerfile: packaging/cnb.Dockerfile
    volumes:
      - /root/.cache/uv
      - /FlowKit-master
  env:
    UV_DEFAULT_INDEX: https://pypi.org/simple
    QT_QPA_PLATFORM: offscreen

.install: &install
  name: install-dependencies
  script: |
    set -eu
    uv sync --frozen --group dev --group build --python 3.12

.test: &test
  name: run-tests
  script: |
    set -eu
    if [ ! -d /FlowKit-master/data ]; then
      mkdir -p /FlowKit-master
      # /FlowKit-master is a mounted volume; clear its contents instead of
      # removing the mount point itself.
      find /FlowKit-master -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      git clone --depth 1 https://github.com/whitews/FlowKit.git /FlowKit-master
    fi
    uv run --frozen --no-sync pytest -q

.build: &build
  name: build-linux-package
  script: |
    set -eu
    uv run --frozen --no-sync pyinstaller packaging/cytodesk.spec --noconfirm --clean
    dist/CytoDesk/CytoDesk --version
    tar -czf dist/CytoDesk-linux-x64.tar.gz -C dist CytoDesk
    ls -lh dist/CytoDesk-linux-x64.tar.gz

.release-body: &release-body
  name: write-release-body
  script: |
    set -eu
    {
      if [ -n "${CNB_TAG_MESSAGE:-}" ]; then
        printf '%s\n' "${CNB_TAG_MESSAGE}"
      else
        printf '%s\n' "${CNB_COMMIT_MESSAGE}"
      fi
      printf '\n---\n\n构建记录: %s\n' "${CNB_BUILD_WEB_URL}"
    } > release-body.md
    cat release-body.md

.release-pipeline: &release-pipeline
  <<: *linux-pipeline
  name: linux-release
  label:
    type: RELEASE
  stages:
    - *install
    - *test
    - *build
    - *release-body
    - name: create-release
      type: git:release
      options:
        descriptionFromFile: release-body.md
        latest: true
    - name: upload-release-asset
      image: cnbcool/attachments:latest
      settings:
        attachments:
          - "./dist/CytoDesk-linux-x64.tar.gz"

# Match the GitHub release trigger: only version tags build/release.
"0.*":
  tag_push:
    - *release-pipeline
"v*":
  tag_push:
    - *release-pipeline
