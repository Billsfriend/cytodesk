name: Build Windows and macOS with PyInstaller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "0.*"
      - "v*"

permissions:
  contents: write

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14
            name: macos-arm64
          # Intel macOS runner. If GitHub retires this label, remove this entry
          # or replace it with another x86_64 macOS runner.
          - os: macos-15-intel
            name: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group build --python 3.12

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/cytodesk.spec --noconfirm --clean

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist/CytoDesk/CytoDesk.exe" `
            -ArgumentList "--version" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CytoDesk.exe failed with exit code $($process.ExitCode)"
          }

      - name: Smoke test macOS package
        if: runner.os == 'macOS'
        run: dist/CytoDesk.app/Contents/MacOS/CytoDesk --version

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/CytoDesk/*" `
            -DestinationPath "dist/CytoDesk-${{ matrix.name }}.zip" `
            -Force

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent CytoDesk.app "CytoDesk-${{ matrix.name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CytoDesk-${{ matrix.name }}
          path: dist/CytoDesk-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
