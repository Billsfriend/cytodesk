[project]
name = "cytodesk"
version = "0.2.0"
description = "CytoDesk - a desktop flow cytometry analysis application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "CytoDesk contributors" }]
dependencies = [
    "contourpy>=1.3.1",
    "flowkit>=1.3.2,<1.4",
    "numpy>2,<3",
    "pandas>=2.2,<3",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "scipy>=1.14",
]

[project.scripts]
cytodesk = "cytodesk.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cytodesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
